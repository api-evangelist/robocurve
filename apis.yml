name: Robocurve
description: >-
  Robocurve is a San Francisco Public Benefit Corporation (Y Combinator Summer
  2026) building open-source tools and independent benchmarks to help society
  understand what AI and robots can actually do in the physical world. Its
  flagship framework, Inspect Robots ("the Inspect AI for robotics"), runs any
  vision-language-action policy on any embodiment against any benchmark with full
  trace logs and live Rerun visualization, and integrates with ROS, Isaac Lab,
  and LeRobot. World Evals is its curated catalog of physical-world benchmarks
  (KitchenBench, DataCenterBench). Everything ships MIT-licensed as Python
  packages with a command-line interface rather than a hosted REST API.
