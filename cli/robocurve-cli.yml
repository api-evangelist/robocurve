  - --embodiment
  - --task
  - --instruction
  constructor_args:
  - -P key=value
  - -E key=value
  - -T key=value
  execution:
  - --sim
  - --epochs N
  - --max-steps N
  - --seed
  - --fail-on-error
  output:
  - --log-dir
